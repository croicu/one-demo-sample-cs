name: CD

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Tag/name for a manual test release (creates a draft, not a real published release)"
        required: true
        default: "manual-test"

jobs:
  release-linux:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag_name: ${{ steps.tag.outputs.value }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Publish
        run: dotnet publish src/OneDemoSample -c Release

      - name: Archive
        run: |
          cd out/Release/net10.0/publish
          zip -r ../../../../one-demo-sample.zip .

      - id: tag
        run: echo "value=${{ github.event.inputs.tag_name || github.ref_name }}" >> "$GITHUB_OUTPUT"

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.value }}
          draft: ${{ github.event_name == 'workflow_dispatch' }}
          files: one-demo-sample.zip
